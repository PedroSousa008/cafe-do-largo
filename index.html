<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Gomil</title>
    <meta name="description" content="Café Gomil, na Rua do Godinho, em Matosinhos.">
    <meta property="og:title" content="Café Gomil">
    <meta property="og:description" content="Na Rua do Godinho, em Matosinhos.">
    <meta property="og:locale" content="pt_PT">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cafe-do-largo-seven.vercel.app/">
    <link rel="canonical" href="https://cafe-do-largo-seven.vercel.app/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="images/sala.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip" href="#conteudo">Saltar para o conteúdo</a>

    <header class="site-header">
        <div class="frame header-bar">
            <a class="wordmark" href="#inicio" data-field="name">Café Gomil</a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navegacao">Menu</button>
            <nav id="navegacao" class="site-nav" aria-label="Navegação principal">
                <a href="#inicio">Início</a>
                <a href="#cafe">O Café</a>
                <a href="#ementa">Ementa</a>
                <a href="#visitar">Visitar</a>
            </nav>
        </div>
    </header>

    <main id="conteudo">
        <section id="inicio" class="hero">
            <!-- Fotografia provisória. Para a substituir, ver js/cafe.js. -->
            <figure class="hero-figure">
                <img src="images/sala.jpg" width="1800" height="1200" alt="Balcão de um café, com madeira, uma máquina e a porta aberta para a luz da rua." fetchpriority="high">
            </figure>
            <div class="frame">
                <div class="hero-text">
                    <h1 data-field="name">Café Gomil</h1>
                    <p data-field="tagline">Matosinhos.</p>
                </div>
            </div>
        </section>

        <section id="cafe" class="about">
            <div class="frame about-grid">
                <figure class="about-figure">
                    <img src="images/pastelaria.jpg" width="1600" height="2400" alt="Pastéis de nata numa vitrina, no momento em que são servidos." loading="lazy" decoding="async">
                </figure>
                <div class="about-copy">
                    <h2>O café</h2>
                    <p data-field="about">Na Rua do Godinho, em Matosinhos.</p>
                </div>
            </div>
        </section>

        <section id="ementa" class="menu">
            <div class="frame">
                <h2>Ementa</h2>
                <div id="ementa-conteudo">
                    <p class="quiet">A ementa será publicada aqui.</p>
                </div>
            </div>
        </section>

        <section id="visitar" class="visit">
            <div class="frame visit-split">
                <div class="visit-hours">
                    <h2>Horário</h2>
                    <div id="horario-conteudo" class="hours"></div>
                </div>
                <div class="visit-rule" aria-hidden="true"></div>
                <div class="visit-side">
                    <div>
                        <h2>Visitar</h2>
                        <a id="morada-link" class="address-link"></a>
                    </div>
                    <div>
                        <h2>Contacto</h2>
                        <div class="contact-links">
                            <a id="email-link" class="icon-link" href="mailto:cafegomil@hotmail.com" aria-label="Enviar email para cafegomil@hotmail.com">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <rect x="3" y="5" width="18" height="14" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
                                    <path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.5"></path>
                                </svg>
                            </a>
                            <a id="facebook-link" class="icon-link" href="https://www.facebook.com/profile.php?id=100054219442655&amp;sk=photos" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path fill="currentColor" d="M14.2 8.4V6.9c0-.8.4-1.2 1.3-1.2H17V3h-2.2C12.1 3 11 4.3 11 6.7v1.7H9v2.6h2V21h3.2v-9.9h2.2l.4-2.7h-2.6z"></path>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="frame footer-grid">
            <div>
                <p class="footer-name" data-field="name">Café Gomil</p>
                <p id="rodape-morada" class="footer-address" hidden></p>
            </div>
            <div class="footer-meta">
                <nav class="footer-nav" aria-label="Rodapé">
                    <a href="#inicio">Início</a>
                    <a href="#cafe">O Café</a>
                    <a href="#ementa">Ementa</a>
                    <a href="#visitar">Visitar</a>
                </nav>
                <p class="legal">© <span id="ano">2026</span> <span data-field="name">Café Gomil</span></p>
            </div>
        </div>
    </footer>

    <script src="js/cafe.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
