<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Gomil</title>
    <meta name="description" content="Café Gomil, na Rua do Godinho, em Matosinhos.">
    <meta property="og:title" content="Café Gomil">
    <meta property="og:description" content="Na Rua do Godinho, em Matosinhos.">
    <meta property="og:locale" content="pt_PT">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cafe-do-largo-seven.vercel.app/">
    <link rel="canonical" href="https://cafe-do-largo-seven.vercel.app/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="images/sala.jpg">
    <link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>
    <a class="skip" href="#conteudo">Saltar para o conteúdo</a>

    <header class="site-header">
        <div class="header-bar">
            <a class="wordmark" href="#inicio">
                <img src="images/logo.png?v=5" width="1226" height="1010" alt="Café Gomil">
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navegacao">Menu</button>
            <nav id="navegacao" class="site-nav" aria-label="Navegação principal">
                <a href="#ementa">Ementa</a>
                <a href="#visitar">Visitar</a>
                <a class="nav-pin" id="pin-link" href="https://www.google.com/maps/dir/?api=1&amp;destination=Rua%20do%20Godinho%2C%20483%2C%204450-149%20Matosinhos%2C%20Portugal" target="_blank" rel="noopener noreferrer" aria-label="Direções para a Rua do Godinho, 483">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="1.5" d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"></path>
                        <circle cx="12" cy="10" r="2.15" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
                    </svg>
                </a>
            </nav>
        </div>
    </header>

    <main id="conteudo">
        <section id="inicio" class="hero">
            <figure class="hero-figure">
                <img src="images/sala.jpg" width="1448" height="1086" alt="Sala do Café Gomil, com mesas de madeira, o balcão e a montra para a rua." fetchpriority="high">
                <div class="hero-mark">
                    <h1>CAFÉ GOMIL</h1>
                    <p>MATOSINHOS</p>
                </div>
            </figure>
        </section>

        <section id="ementa" class="menu">
            <div class="frame">
                <h2>Ementa</h2>
                <ul class="menu-bar" role="tablist" aria-label="Secções da ementa">
                    <li role="presentation"><button type="button" role="tab" id="tab-snacks" data-category="Snacks" aria-controls="ementa-conteudo" aria-selected="true" class="is-active">Snacks</button></li>
                    <li role="presentation"><button type="button" role="tab" id="tab-entradas" data-category="Entradas" aria-controls="ementa-conteudo" aria-selected="false">Entradas</button></li>
                    <li role="presentation"><button type="button" role="tab" id="tab-pratos" data-category="Pratos Principais" aria-controls="ementa-conteudo" aria-selected="false">Pratos Principais</button></li>
                    <li role="presentation"><button type="button" role="tab" id="tab-sobremesa" data-category="Sobremesa" aria-controls="ementa-conteudo" aria-selected="false">Sobremesa</button></li>
                    <li role="presentation"><button type="button" role="tab" id="tab-bebidas" data-category="Bebidas" aria-controls="ementa-conteudo" aria-selected="false">Bebidas</button></li>
                </ul>
                <div id="ementa-conteudo" role="tabpanel" aria-labelledby="tab-snacks">
                    <p class="quiet">A ementa será publicada aqui.</p>
                </div>
            </div>
        </section>

        <section id="avaliacoes" class="reviews" hidden aria-labelledby="avaliacoes-titulo">
            <h2 id="avaliacoes-titulo" class="reviews-title">Avaliações</h2>
            <div class="reviews-stage" id="avaliacoes-conteudo"></div>
            <div class="reviews-nav" id="avaliacoes-nav" hidden>
                <button type="button" class="reviews-step" data-review="prev">Anterior</button>
                <button type="button" class="reviews-step" data-review="next">Seguinte</button>
            </div>
        </section>

        <section id="visitar" class="visit">
            <div class="frame visit-split">
                <div class="visit-hours">
                    <h2>Horário</h2>
                    <div id="horario-conteudo" class="hours"></div>
                </div>
                <div class="visit-rule" aria-hidden="true"></div>
                <div class="visit-side">
                    <div>
                        <h2>Visitar</h2>
                        <a id="morada-link" class="address-link"></a>
                    </div>
                    <div>
                        <h2>Contacto</h2>
                        <div class="contact-links">
                            <a id="email-link" class="icon-link" href="mailto:cafegomil@hotmail.com" aria-label="Enviar email para cafegomil@hotmail.com">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <rect x="3" y="5" width="18" height="14" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
                                    <path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.5"></path>
                                </svg>
                            </a>
                            <a id="facebook-link" class="icon-link" href="https://www.facebook.com/profile.php?id=100054219442655&amp;sk=photos" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path fill="currentColor" d="M14.2 8.4V6.9c0-.8.4-1.2 1.3-1.2H17V3h-2.2C12.1 3 11 4.3 11 6.7v1.7H9v2.6h2V21h3.2v-9.9h2.2l.4-2.7h-2.6z"></path>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="frame footer-grid">
            <div>
                <p class="footer-name" data-field="name">Café Gomil</p>
                <p id="rodape-morada" class="footer-address" hidden></p>
            </div>
            <div class="footer-meta">
                <nav class="footer-nav" aria-label="Rodapé">
                    <a href="#inicio">Início</a>
                    <a href="#ementa">Ementa</a>
                    <a href="#visitar">Visitar</a>
                </nav>
                <p class="legal">© <span id="ano">2026</span> <span data-field="name">Café Gomil</span></p>
            </div>
        </div>
    </footer>

    <script src="js/cafe.js?v=10"></script>
    <script src="js/reviews.js"></script>
    <script src="js/main.js?v=4"></script>
    <script src="js/reviews-banner.js?v=2"></script>
</body>
</html>
